name: verify

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-web:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser for isolated browser checks
        shell: bash
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium
          node --input-type=module -e 'import { chromium } from "playwright-core"; import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_ENV, `PI_DESK_BROWSER_EXECUTABLE=${chromium.executablePath()}\n`);'
      - name: Build and verify isolated SDK, HTTP and PTY flows
        shell: bash
        run: |
          npm run build
          go test ./internal/remotehelper ./internal/remoteprotocol
          node --input-type=module <<'NODE'
          import { readdirSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          for (const file of readdirSync('src').filter(name => name.endsWith('.test.ts'))) {
            console.log(`::notice title=Test suite::${file}`);
            const result = spawnSync(process.execPath, ['--test', `src/${file}`], { encoding: 'utf8', timeout: 240000, maxBuffer: 16 * 1024 * 1024 });
            const output = (result.stdout || '') + (result.stderr || '') + (result.error ? '\n' + result.error.message : '');
            console.log(output);
            if (result.status !== 0) {
              console.log(`::error title=${file}::` + output.slice(-16000).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A'));
              process.exit(1);
            }
          }
          NODE
      - name: Pack and verify npx executable outside the checkout
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p build/npm
          npm pack --ignore-scripts --pack-destination build/npm
          packages=("$PWD"/build/npm/*.tgz)
          cd "$(mktemp -d)"
          npm exec --yes --package "${packages[0]}" -- pi-desk --version
          npm exec --yes --package "${packages[0]}" -- pi-desk web --help
      - name: Upload executable package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: pi-desk-package
          path: build/npm/*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Upload Web production resources
        uses: actions/upload-artifact@v4
        with:
          name: pi-desk-web-${{ matrix.os }}
          path: |
            dist/
            build/remote-helper/artifacts/
            frontend/dist/
            package.json
            package-lock.json
            frontend/package.json
            frontend/src/web/dsh/LICENSE.txt
            frontend/src/web/dsh/Montserrat-OFL.txt
            README.md
            REFACTOR_PLAN.md
            docs/
            LICENSE
            internal/workspaceapp/assets/
            internal/appservice/resources/pi-desk-todo.ts
            internal/appservice/resources/pi-desk-goal.ts
          if-no-files-found: error
          retention-days: 7

  release:
    needs: node-web
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - uses: actions/download-artifact@v4
        with:
          name: pi-desk-package
          path: package
      - name: Check release tag matches package version
        id: version
        run: |
          version=$(tar -xOf package/*.tgz package/package.json | node --input-type=module -e 'let text="";for await(const chunk of process.stdin)text+=chunk;console.log(JSON.parse(text).version)')
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish verified package to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp package/*.tgz package/pi-desk.tgz
          (cd package && sha256sum pi-desk.tgz > SHA256SUMS)
          printf 'Requires Node.js 22.19+ and Git. No Go or npm account needed.\n\n```sh\nnpx https://github.com/%s/releases/download/%s/pi-desk.tgz web\n```\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > release-notes.md
          flags=()
          if [[ "$PACKAGE_VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" package/pi-desk.tgz package/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --title "Pi Desk $GITHUB_REF_NAME" --notes-file release-notes.md "${flags[@]}"
