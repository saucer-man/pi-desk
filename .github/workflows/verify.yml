name: verify

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-web:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser for isolated browser checks
        shell: bash
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium
          node --input-type=module -e 'import { chromium } from "playwright-core"; import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_ENV, `PI_DESK_BROWSER_EXECUTABLE=${chromium.executablePath()}\n`);'
      - name: Build and verify isolated SDK, HTTP and PTY flows
        run: npm run check
      - name: Upload Web production resources
        uses: actions/upload-artifact@v4
        with:
          name: pi-desk-web-${{ matrix.os }}
          path: |
            dist/
            build/remote-helper/artifacts/
            frontend/dist/
            package.json
            package-lock.json
            frontend/package.json
            frontend/src/web/dsh/LICENSE.txt
            frontend/src/web/dsh/Montserrat-OFL.txt
            README.md
            REFACTOR_PLAN.md
            docs/
            LICENSE
            internal/workspaceapp/assets/
            internal/appservice/resources/pi-desk-todo.ts
            internal/appservice/resources/pi-desk-goal.ts
          if-no-files-found: error
          retention-days: 7
